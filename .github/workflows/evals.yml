name: Skill Evals

on: [push, pull_request]

jobs:
  evals:
    runs-on: ubuntu-latest
    # All suites shell out to the `claude` CLI, which needs an API key.
    # Skip the job on forks / PRs where the secret is not available.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install claude CLI
        run: npm install -g @anthropic-ai/claude-code
      # The trigger suite needs many runs of the full CLI; keep it local.
      - name: Question-quality evals
        run: python scripts/run_evals.py --no-trigger --suite questions
      - name: Report-accuracy evals
        run: python scripts/run_evals.py --no-trigger --suite report
